[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-being"
version = "0.1.5.1"
description = "Цифровое существо, которое живёт, помнит, думает, имеет волю"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Digital Being Team" }
]
keywords = ["ai", "agent", "digital-life", "consciousness", "philosophy"]

# NumPy используется Core напрямую; остальные интеграции опциональны.
dependencies = ["numpy>=1.24.0"]

# Опциональные — для мониторинга, наблюдаемости и tray-режима
[project.optional-dependencies]
monitor = [
    "psutil>=5.9.0",
    "numpy>=1.24.0",
]
tray = [
    "pystray>=0.19.5",
    "plyer>=2.1.0",
    "Pillow>=10.0.0",
]
dev = [
    "pytest>=7.4.0,<9",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pre-commit>=3.7.0",
    # Пин ruff — единый канон статика с rev в .pre-commit-config.yaml
    # (контроль — tests/test_static_pin.py).
    "ruff==0.5.7",
    # Пины совпадают с .pre-commit-config.yaml: CI и локальные хуки дают
    # одинаковый вердикт вместо двух разных стандартов качества.
    "mypy==1.11.2",
    "bandit==1.7.8",
    # PyYAML — парсинг .pre-commit-config.yaml в мета-тесте.
    # В средах без него мета-тест скипается (видно в счётчиках гейта).
    "PyYAML>=6",
]
build = [
    "pyinstaller>=6.0",
]
web = [
    "aiohttp>=3.9.0",
]
all = [
    "psutil>=5.9.0",
    "pystray>=0.19.5",
    "plyer>=2.1.0",
    "Pillow>=10.0.0",
    "aiohttp>=3.9.0",
    "pytest>=7.4.0,<9",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0.0",
    "pre-commit>=3.7.0",
    "ruff==0.5.7",
    "mypy==1.11.2",
    "bandit==1.7.8",
    "PyYAML>=6",
    "pyinstaller>=6.0",
]

[project.scripts]
digital-being = "main:run_long_living_agent"
digital-being-tray = "main_tray:run"

[project.urls]
Homepage = "https://github.com/han13ter2014-web/Digital_being"
Documentation = "https://github.com/han13ter2014-web/Digital_being/blob/main/README.md"
Issues = "https://github.com/han13ter2014-web/Digital_being/issues"

[tool.setuptools]
py-modules = ["main", "main_tray"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "src*", "data_bootstrap*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.txt", "py.typed"]

# === mypy: опциональная статическая типизация ===
# Проект поддерживает PEP 561 (py.typed маркеры в каждом публичном пакете).
# Чтобы downstream-юзеры получали типы, mypy должна проходить хотя бы
# для публичного API. Здесь — мягкие настройки (не падаем на warnings).
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
# Постепенное включение: не падаем на missing imports (psutil, aiohttp, pystray)
ignore_missing_imports = true
# Показываем заметные проблемы, но не делаем CI строгим.
disallow_untyped_defs = false
disallow_any_generics = false
# Подмодули с динамической загрузкой (например, src/guides/) — пропускаем.
exclude = [
    "^src/guides/",
    "^build/",
    "^dist/",
    "^installer_output/",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Benchmarks используют отдельный совместимый запуск и не входят в обычный CI gate.
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# addopts: убрали "-v" — оно ломало переопределение через CLI (pytest -q).
# "-v" теперь передаётся только при ручном запуске.
# --cov-* опции включают измерение покрытия, но не падают, если cov не установлен
# (pytest-cov подхватывается плагином из [project.optional-dependencies] dev).
# Запуск с отчётом покрытия: pytest --cov-report=term-missing
addopts = "--ignore=tests/benchmarks --tb=short"
markers = [
    "slow: медленные тесты (исключаются через -m 'not slow')",
    "long_run: длинные сценарные тесты (отдельно в CI)",
]
asyncio_mode = "auto"
