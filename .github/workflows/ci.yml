name: CI — lint + tests

on:
  push:
    branches: [main, develop, "feature/**", "etap-3"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Разрешаем отменять предыдущие запуски на том же PR/branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================
  # 1. LINT — статический анализ (compileall, pyflakes, ast.parse)
  # ============================================================
  lint:
    name: Lint (compileall + AST + import-check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-lint-

      - name: Install deps (minimal — без опциональных групп)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pyflakes

      - name: Syntax check (compileall)
        run: |
          python -m compileall -q src/ config/ tests/ main.py main_tray.py
          echo "✅ Все файлы компилируются"

      - name: AST parse (защита от SyntaxError в динамических строках)
        run: |
          python -c "
          import ast, os, sys
          errs = 0
          for root in ('src', 'config', 'tests'):
              for dp, _, fns in os.walk(root):
                  for fn in fns:
                      if fn.endswith('.py'):
                          path = os.path.join(dp, fn)
                          try:
                              ast.parse(open(path, encoding='utf-8').read(), filename=path)
                          except SyntaxError as e:
                              print(f'SYNTAX ERROR in {path}: {e}', file=sys.stderr)
                              errs += 1
          if errs:
              sys.exit(1)
          print(f'✅ AST parse OK')
          "

      - name: Import smoke test
        run: |
          python -m pytest -q tests/test_ci_smoke.py --tb=short --disable-warnings

      - name: pyflakes
        run: |
          # Только предупреждения, не падаем. Полезно для код-ревью.
          python -m pyflakes src/ config/ tests/ main.py main_tray.py || true

  # ============================================================
  # 2. TESTS — pytest (unit + integration + performance)
  # ============================================================
  test:
    name: Tests (unit + integration)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-test-

      - name: Install deps (полный набор)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"

      - name: Run unit + integration tests (быстрые)
        env:
          # Эти переменные используются SimulationConfig и DigitalBeing
          DIGITAL_BEING_NAME: TestAgent
          DIGITAL_BEING_DEBUG: "0"
        run: |
          python -c "import os; os.makedirs('data', exist_ok=True)"
          python -m pytest tests/test_integration.py -v --tb=short -m "not slow and not long_run"

      - name: Run performance tests (только ubuntu — там быстрее)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          DIGITAL_BEING_NAME: TestAgent
        run: |
          python -m pytest tests/test_performance.py -v --tb=short -m "not slow and not long_run"

      - name: Run Этап 3 plugin/scenario tests (Этап 4.3)
        env:
          DIGITAL_BEING_NAME: TestAgent
        run: |
          python -m pytest tests/test_plugin_system.py tests/test_nursery_watcher.py tests/test_web_dashboard.py -v --tb=short

      - name: Run Этап 4.3 long-run tests (только ubuntu, дольше)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          DIGITAL_BEING_NAME: TestAgent
        run: |
          python -m pytest tests/test_long_run_scenarios.py -v --tb=short

      - name: Coverage report (with gate)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          DIGITAL_BEING_NAME: TestAgent
          # Coverage gate: не пропускаем PR с деградацией ниже 40%.
          # Поднять до 50/60 можно отдельным коммитом, когда покрытие догонит.
          COVERAGE_FAIL_UNDER: "40"
        run: |
          python -m pytest tests/ -v --tb=short \
            --cov=src --cov=config \
            --cov-report=term-missing:skip-covered \
            --cov-report=xml \
            --cov-fail-under=$COVERAGE_FAIL_UNDER \
            -m "not slow and not long_run"
        # Раньше был continue-on-error: true, что делало gate бесполезным.
        # Теперь — реальный gate: если покрытие < 40% (без slow/long_run),
        # CI падает. Локально gate не срабатывает (fail_under=0 в .coveragerc).

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ============================================================
  # 3. SECURITY — базовая проверка секретов и утечек
  # ============================================================
  security-scan:
    name: Security scan (basic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          # Простая проверка — нет ли AWS, GitHub tokens, etc. в коде
          ! grep -rEn "(AKIA[0-9A-Z]{16}|ghp_[0-9a-zA-Z]{36}|sk-[a-zA-Z0-9]{20,})" \
              src/ config/ tests/ main.py main_tray.py 2>/dev/null \
              || (echo "❌ Найдены hardcoded секреты"; exit 1)
          echo "✅ Hardcoded секретов не найдено"