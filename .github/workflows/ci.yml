name: CI — static + full regression

on:
  push:
    branches: [main, develop, "feature/**", "etap-3"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static (ruff + mypy + bandit + AST)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-static-${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-static-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-static-

      - name: Install static toolchain
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check src/ config/ tests/ main.py main_tray.py

      - name: Ruff lint auxiliary scripts
        run: python -m ruff check examples/ tools/manual/

      - name: Ruff format check
        run: python -m ruff format --check src/ config/ tests/ main.py main_tray.py

      - name: Mypy public entry-point gate
        run: >-
          python -m mypy --config-file pyproject.toml
          --explicit-package-bases --no-site-packages --follow-imports=skip
          main.py main_tray.py

      - name: Bandit security gate
        run: python -m bandit -r src/ config/ main.py main_tray.py -ll --skip B101,B601

      - name: Syntax check (compileall)
        run: python -m compileall -q src/ config/ tests/ main.py main_tray.py

      - name: AST parse (защита от SyntaxError в динамических строках)
        run: |
          python -c "
          import ast, os, sys
          errs = 0
          for root in ('src', 'config', 'tests'):
              for dp, _, fns in os.walk(root):
                  for fn in fns:
                      if fn.endswith('.py'):
                          path = os.path.join(dp, fn)
                          try:
                              ast.parse(open(path, encoding='utf-8').read(), filename=path)
                          except SyntaxError as e:
                              print(f'SYNTAX ERROR in {path}: {e}', file=sys.stderr)
                              errs += 1
          if errs:
              sys.exit(1)
          print('AST parse OK')
          "

      - name: Import smoke test
        run: python -m pytest -q tests/test_ci_smoke.py --tb=short --disable-warnings

  test:
    name: Full regression (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ matrix.python-version }}-${{ hashFiles('requirements.txt', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-test-

      - name: Install full dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all]"

      - name: Run full regression
        if: matrix.os != 'ubuntu-latest' || matrix.python-version != '3.12'
        env:
          DIGITAL_BEING_NAME: TestAgent
          DIGITAL_BEING_DEBUG: "0"
        run: python -m pytest -q

      - name: Full regression with branch coverage gate
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        env:
          DIGITAL_BEING_NAME: TestAgent
          DIGITAL_BEING_DEBUG: "0"
          # Полный замер с ветками: 77.97%. Сохраняем прежний консервативный
          # порог; повышение — отдельным изменением после наблюдения за Ubuntu CI.
          COVERAGE_FAIL_UNDER: "40"
        run: >-
          python -m pytest -q
          --cov=src --cov=config --cov-branch
          --cov-report=term-missing:skip-covered
          --cov-report=xml
          --cov-fail-under=$COVERAGE_FAIL_UNDER

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  security-scan:
    name: Security scan (basic)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Scan for hardcoded secrets
        run: |
          ! grep -rEn "(AKIA[0-9A-Z]{16}|ghp_[0-9a-zA-Z]{36}|sk-[a-zA-Z0-9]{20,})" \
              src/ config/ tests/ main.py main_tray.py 2>/dev/null \
              || (echo "❌ Найдены hardcoded секреты"; exit 1)
          echo "✅ Hardcoded секретов не найдено"
